# Colors from Atom's One Dark palette.
name = "one-dark"
syntax-theme = "TwoDark"

window = "#282c34"
titlebar = "#21252b"
border = "#ffffff1a"
gutter = "#5c6370"
gutter-separator = "#ffffff12"
title-text = "#abb2bf"
traffic-lights = ["#e06c75", "#e5c07b", "#98c379"]
shadow = "#000000b4"
line-emphasis = "#ffffff0f"
diff-added = "#98c37926"
diff-removed = "#e06c7526"

[background]
kind = "linear"
angle = 135.0
stops = [
  { offset = 0.0, color = "#3e4451" },
  { offset = 1.0, color = "#61afef" },
]
