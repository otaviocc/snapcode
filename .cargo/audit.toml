# cargo-audit policy. Read by CI and by a local `cargo audit` alike. Only the
# accepted advisories live here: `[output] deny` would work too, but that table
# has no defaults in cargo-audit 0.22 — every field of it has to be spelled out
# or the file fails to parse — so CI passes `--deny warnings` on the command
# line instead.

[advisories]
# Advisories the project has looked at and accepted. None is a vulnerability,
# and none is reachable from a dependency snapcode chooses directly.
ignore = [
    # `unmaintained` notices, transitive through syntect. Nothing here can drop
    # them without dropping syntax highlighting.
    "RUSTSEC-2025-0141", # bincode 1.3.3; syntect -> bincode
    "RUSTSEC-2024-0320", # yaml-rust 0.4.5; syntect -> yaml-rust
    # `unmaintained`, transitive through the font and image stacks.
    "RUSTSEC-2026-0192", # ttf-parser 0.25.1; cosmic-text -> fontdb -> ttf-parser
    "RUSTSEC-2024-0436", # paste 1.0.15; image -> exr -> pulp -> paste
    # `unsound`, both in lru 0.12.5, which arrives through ratatui 0.29. Neither
    # is reachable from snapcode: the TUI never calls LruCache::pop or IterMut,
    # and ratatui uses the cache for its own line rendering. A ratatui 0.30
    # upgrade drops them, and is worth doing on its own terms.
    "RUSTSEC-2026-0253", # LruCache::pop panic safety
    "RUSTSEC-2026-0002", # IterMut stacked-borrows violation
]
